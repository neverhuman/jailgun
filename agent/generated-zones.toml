schema_version = 1

[[zone]]
path = "assets/dashboard-results.png"
source = "scripts/render-dashboard-ux-qa.mjs"
generator = "Chromium screenshot verified by scripts/publish-doc-screenshot.mjs"
command = "bash ops/ci/ux-qa.sh && node scripts/publish-doc-screenshot.mjs"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "assets/dashboard-results.json"
source = "target/jankurai/ux-qa.json"
generator = "scripts/publish-doc-screenshot.mjs"
command = "node scripts/publish-doc-screenshot.mjs"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "Cargo.lock"
source = "Cargo.toml"
generator = "cargo"
command = "cargo generate-lockfile"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "package-lock.json"
source = "package.json"
generator = "npm"
command = "npm install --package-lock-only"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "contracts/json-schema/event.schema.json"
source = "crates/jailgun-core/src/event.rs"
generator = "scripts/generate-contracts.mjs"
command = "bash ops/ci/contracts.sh --write"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "contracts/fixtures/events/"
source = "scripts/generate-contracts.mjs"
generator = "scripts/generate-contracts.mjs"
command = "bash ops/ci/contracts.sh --write"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "contracts/json-schema/workflow.schema.json"
source = "crates/jailgun-workflow/src/"
generator = "schemars via crates/jailgun-workflow/examples/contract_schema.rs"
command = "bash ops/ci/contracts.sh --write"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "apps/dashboard/src/generated/workflow.ts"
source = "contracts/json-schema/workflow.schema.json"
generator = "scripts/generate-contracts.mjs"
command = "bash ops/ci/contracts.sh --write"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "agent/repo-score.json"
source = "tracked source tree"
generator = "jankurai"
command = "bash ops/ci/jankurai.sh --write"
read_only = true
write_policy = "generator-only"

[[zone]]
path = "agent/repo-score.md"
source = "tracked source tree"

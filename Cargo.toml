[workspace]
members = [
  "crates/jailgun-core",
  "crates/jailgun-workflow",
  "crates/jailgun-deploy",
  "crates/jailgun-notify",
  "crates/jailgun-orchestrator",
  "crates/jailgun-server",
  "crates/jailgun-cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "git@github.com:neverhuman/jailgun.git"
rust-version = "1.95"

[workspace.dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-child-process"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Match the already locked SDK transport type to apply local connection policy.
reqwest-mcp = { package = "reqwest", version = "=0.13.5", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "hooks"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
schemars = "=1.2.2"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"

name: Pinned validation tools
description: Set up locked validation runtimes and cache dependency downloads only
runs:
  using: composite
  steps:
    - name: Install task runner and Rust toolchain manager in the disposable guest
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y just rustup
        # Qualified LAN images use this fixed runner home; no event/env-derived path.
        echo "/home/runner/.cargo/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
        package-manager-cache: false
        cache: npm
        cache-dependency-path: |
          .node-version
          package-lock.json
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: .python-version
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
        key: lan-${{ runner.os }}-${{ runner.arch }}-cargo-downloads-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'ops/distribution/tools.json') }}
    - name: Verify selected toolchains
      shell: bash
      run: |
        rustup show active-toolchain
        rustc --version
        node --version
        python3 --version

name: Jankurai

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "2"
  JAILGUN_WORKERS: "2"

concurrency:
  group: jankurai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Jankurai
        run: cargo install --git https://github.com/neverhuman/jankurai.git --rev 34608d016de5fd24e677244112941d240ca00188 --locked --force --target-dir "$PWD/target" jankurai
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bash ops/ci/ux-qa.sh
        env:
          JAILGUN_TEST_CHROME: /usr/bin/google-chrome
      - run: bash ops/ci/install-security.sh
      - run: bash ops/ci/security.sh
      - run: bash ops/ci/db.sh
      - run: bash ops/ci/contracts.sh
      - run: bash ops/ci/jankurai.sh
      - name: Enforce zero findings
        run: jq -e '(.caps_applied | type == "array" and length == 0) and (.findings | type == "array" and length == 0) and .score >= 95' target/jankurai/audit/repo-score.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: jankurai-receipts
          if-no-files-found: error
          path: |
            target/jankurai/audit/repo-score.json
            target/jankurai/audit/repo-score.md
            target/jankurai/security/evidence.json
            target/jankurai/db/evidence.json
            target/jankurai/repair-queue.jsonl

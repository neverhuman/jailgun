name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "2"
  JAILGUN_WORKERS: "2"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash ops/ci/rust.sh

  worker-mock:
    name: worker mock API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash ops/ci/worker.sh

  node:
    name: node
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash ops/ci/node.sh

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bash ops/ci/install-security.sh
      - run: bash tools/security-lane.sh # gitleaks detect dependency-review npm audit cargo audit syft sbom actionlint; catalog: jankurai security run . --out target/jankurai/security/evidence.json
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: security-evidence
          path: |
            target/jankurai/security/evidence.json

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm ci
      - run: bash ops/ci/contracts.sh

  ux-qa:
    name: ux-qa
    needs: [node]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bash ops/ci/ux-qa.sh # catalog: jankurai ux audit --config agent/ux-qa.toml --out target/jankurai/ux-qa.json
        env:
          JAILGUN_TEST_CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: ux-qa
          path: |
            target/jankurai/ux-qa.json
            artifacts/ux-qa/

  e2e:
    name: e2e
    needs: [rust, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y python3 xvfb x11vnc xauth x11-utils
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bash ops/ci/e2e.sh
        env:
          JAILGUN_TEST_CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: e2e-artifacts
          path: |
            target/concept-workflows/**/evidence.json
            target/browser-capture/**/evidence.json
            target/daemon proofs/**/evidence.json

  copy-code:
    name: copy-code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Jankurai
        run: cargo install --git https://github.com/neverhuman/jankurai.git --rev b88562fdb124aa86dedd70ab972e7d0d87e58be1 --locked --force --target-dir "$PWD/target" jankurai
      - run: bash ops/ci/copy-code.sh # catalog: cargo run -p jankurai -- copy-code . --json target/jankurai/copy-code.json --md target/jankurai/copy-code.md
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: copy-code
          path: |
            target/jankurai/copy-code.json
            target/jankurai/copy-code.md

  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash ops/ci/release.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: release-readiness
          path: |
            target/jankurai/release-readiness.json

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash ops/ci/db.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: database-evidence
          if-no-files-found: error
          path: target/jankurai/db/evidence.json

  documentation:
    name: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm ci
      - run: bash ops/ci/docs.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: documentation-evidence
          if-no-files-found: error
          path: target/jankurai/docs/evidence.json

  platforms:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The DREAM worker delivery is Linux-only; macOS is outside its acceptance scope.
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Linux display prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb x11vnc xauth x11-utils
      - name: Prepare isolated runner user manager for native startup proof
        if: runner.os == 'Linux'
        run: |
          runner_uid="$(id -u)"
          sudo systemctl start "user@${runner_uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${runner_uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${runner_uid}/bus" >> "$GITHUB_ENV"
      - run: bash ops/ci/platform.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: platform-evidence-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/jankurai/db/evidence.json
            target/jankurai/docs/evidence.json
            target/jankurai/ux-qa.json
            target/concept-workflows/**/evidence.json
            target/package-proofs/**/evidence.json
            target/clean-linux-proofs/*/evidence.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: candidate-packages-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/distribution/proof-*/jailgun-*.tar.gz
            target/distribution/proof-*/SHA256SUMS
            target/distribution/proof-*/install.sh

  audit:
    name: audit
    needs: [rust, worker-mock, node, security, contracts, ux-qa, copy-code, release, e2e, database, documentation, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ux-qa
          path: .
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: copy-code
          path: target/jankurai
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: database-evidence
          path: target/jankurai/db
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: documentation-evidence
          path: target/jankurai/docs
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install Jankurai
        run: cargo install --git https://github.com/neverhuman/jankurai.git --rev b88562fdb124aa86dedd70ab972e7d0d87e58be1 --locked --force --target-dir "$PWD/target" jankurai
      - run: bash ops/ci/install-security.sh
      - run: jankurai security run . --strict --profile ci --out target/jankurai/security/evidence.json
      - run: bash ops/ci/jankurai.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: jankurai-audit
          if-no-files-found: error
          path: |
            target/jankurai/audit/repo-score.json
            target/jankurai/audit/repo-score.md
            target/jankurai/repair-queue.jsonl
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofmark/proof-receipt.json
            target/jankurai/language-bad-behavior.log
            target/jankurai/rust/witness-graph.json
            target/jankurai/security/
